# tech-stacks/MANIFEST.yaml
# Tech-Stacks Catalog 索引 + 安裝狀態追蹤
# 來源：PROPOSAL_20260423_017 Phase B
# 對應 ADR：ADR-0031（待 Phase G 新增）
#
# 用途：
#   - SSOT：目錄內所有 stack 的索引（類別 / 類型 / 依賴 / 安裝狀態）
#   - 初始化選擇性搬運的依據（init-workspace.mjs --select-stacks）
#   - 依賴解析 + 驗證（tech-stack-validator.mjs）
#   - vendor 文件審核 trail（vendor_source + vendor_last_vetted）
#
# 編輯規範：
#   - 新增 stack 時先過 skills/tech-stack-onboarding.md 的 checklist
#   - 不可手動刪除既存 entry；改為 installed: false（保留記憶）
#   - depends_on 必指向同 MANIFEST 內 name；循環依賴由 validator 偵測
#
# 欄位說明：
#   name            唯一識別（kebab-case）
#   category        歸屬類別（須出現在 categories:）
#   class           F1/F2/F3（見 ADR-0016）
#   file            單檔模式路徑（相對 tech-stacks/）
#   folder          資料夾模式路徑（與 file 二擇一）
#   depends_on      依賴的其他 stack name（陣列）
#   installed       是否在當前 workspace 啟用
#   platforms       支援作業系統（windows/macos/linux）
#   extends_base    是否為可被繼承的基底 stack（選填）
#   vendor_source   外部 vendor 來源 URL（資料夾模式選填）
#   vendor_last_vetted  vendor 最後審核日期（YYYY-MM-DD）

version: 1.0
schema_version: 1

categories:
  core:
    description: 幾乎所有專案通用（git / testing 基礎 / PR workflow）
    priority: 1
  web-backend:
    description: 後端服務（Node.js / 測試框架 / 程序管理）
    priority: 2
  web-frontend:
    description: Web 前端（Vue / React / 打包工具）
    priority: 2
  desktop:
    description: 桌面應用 UI（Avalonia / WPF / Electron 類）
    priority: 2
  messaging:
    description: 即時通訊 / Bot / Mini App
    priority: 3
  storage:
    description: 資料儲存（檔案 / DB / 快取）
    priority: 2

stacks:
  # ─── web-backend ────────────────────────────────────────
  - name: nodejs-esm-backend
    category: web-backend
    class: F2
    file: web-backend/nodejs-esm-backend.md
    depends_on: []
    installed: true
    platforms: [windows, macos, linux]
    extends_base: true

  - name: testing-nodejs
    category: web-backend
    class: F2
    file: web-backend/testing-nodejs.md
    depends_on: [nodejs-esm-backend]
    installed: true
    platforms: [windows, macos, linux]

  # ─── web-frontend ───────────────────────────────────────
  - name: vue3-vite
    category: web-frontend
    class: F2
    file: web-frontend/vue3-vite.md
    depends_on: []
    installed: true
    platforms: [windows, macos, linux]
    extends_base: true

  - name: vue3-component-pattern
    category: web-frontend
    class: F2
    file: web-frontend/vue3-component-pattern.md
    depends_on: [vue3-vite]
    installed: true
    platforms: [windows, macos, linux]

  # ─── messaging ──────────────────────────────────────────
  - name: telegram-bot
    category: messaging
    class: F2
    file: messaging/telegram-bot.md
    depends_on: [nodejs-esm-backend]
    installed: true
    platforms: [windows, macos, linux]

  - name: telegram-miniapp
    category: messaging
    class: F2
    file: messaging/telegram-miniapp.md
    depends_on: [vue3-vite]
    installed: true
    platforms: [windows, macos, linux]

  - name: telegram-miniapp-sdk
    category: messaging
    class: F2
    file: messaging/telegram-miniapp-sdk.md
    depends_on: [telegram-miniapp]
    installed: true
    platforms: [windows, macos, linux]

  # ─── storage ────────────────────────────────────────────
  - name: file-based-storage
    category: storage
    class: F2
    file: storage/file-based-storage.md
    depends_on: []
    installed: true
    platforms: [windows, macos, linux]

  - name: redis
    category: storage
    class: F2
    file: storage/redis.md   # PROPOSAL_502_017 Q-10 stub；待實際採用時補檔
    depends_on: []
    installed: true   # stub；採用時翻 true 並建檔
    platforms: [linux, macos, windows-wsl]
    notes: "PROPOSAL_502_017 Q-10 stub；解 Sim-A S1 onboarding 熔斷；採用前先建 storage/redis.md"

  # ─── desktop ────────────────────────────────────────────
  # Phase F 新增；預設 installed: false，新 Avalonia 專案 opt-in
  - name: avalonia-ui
    category: desktop
    class: F2
    file: desktop/avalonia-ui.md
    depends_on: []
    installed: true
    platforms: [windows, macos, linux]
    extends_base: true

  - name: semi-avalonia
    category: desktop
    class: F2
    folder: desktop/semi-avalonia/
    depends_on: [avalonia-ui]
    installed: true
    platforms: [windows, macos, linux]
    vendor_source: https://github.com/irihitech/Semi.Avalonia
    vendor_version_locked: "12.0.1"
    vendor_last_vetted: 2026-04-24
