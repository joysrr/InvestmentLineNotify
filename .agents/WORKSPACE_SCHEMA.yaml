# WORKSPACE_SCHEMA.yaml
# Workspace 欄位契約單一事實來源（Single Source of Truth）
# 依 PROPOSAL_20260422_022 建立；tech-stacks / skills 引用時須對齊此 schema
# 新增/修改欄位 → 同步更新 schema_version + last_proposal

schema_version: v1.4
last_modified: 2026-04-24
last_proposal: PROPOSAL_20260424_019  # v1.4: 欄位屬性擴充 interactive + auto_populate

# ============================================================
# 欄位屬性擴充（v1.4；依 PROPOSAL_20260424_019 F-3）
# ============================================================
# interactive: true (預設；省略視為 true)  — 進入 collectAnswers 互動迴圈，由 User 回答
# interactive: false                       — 跳過互動；由 auto_populate 系統填入
#
# auto_populate（interactive: false 時必填）：
#   source: system              — 系統值（搭 value: today 取當天日期）
#   source: default             — 使用 value 作為預設
#   source: derive_from_stacks  — 由選中的 tech-stacks MACHINE_READABLE block 推導
#
# workspace-schema-validator 強制：
#   interactive: false → 必有 auto_populate.source ∈ [system, default, derive_from_stacks]

# ============================================================
# PROJECT_CONTEXT — 專案核心資訊
# ============================================================
PROJECT_CONTEXT:
  project_name:
    type: string
    required: true
    description: "專案代號（snake_case 英文）；作為 workspace 檔名與 CURRENT_WORKSPACE 指標"
  display_name:
    type: string
    required: true
    description: "人類可讀的專案名稱"
  business_domain:
    type: string
    required: true
    description: "業務域描述（一句話）"
  core_entities:
    type: list
    required: false
    description: "核心業務實體（domain entities）清單"
  user_role:
    type: string
    required: false
    description: "專案使用者角色（個人 / 團隊 / 公開）"
  proposal_prefix:
    type: string
    required: false
    description: "專案提案編號前綴（3-5 字母大寫；例：ILN for InvestmentLineNotify）；若該 workspace 有 project scope 提案則必填。依 PROPOSAL_20260422_023 §十七.D"

# ============================================================
# TECH_STACK — 技術棧選擇（對齊 tech-stacks/ 引用）
# ============================================================
TECH_STACK:
  language:
    type: string
    required: true
    referenced_by: [tech-stacks/web-backend/nodejs-esm-backend.md]
    description: "主要程式語言與執行時模式（例：Node.js ESM）"
  frontend:
    type: string
    required: false
    referenced_by: [tech-stacks/web-frontend/vue3-vite.md, tech-stacks/web-frontend/vue3-component-pattern.md]
    description: "前端框架"
  backend:
    type: string
    required: false
    referenced_by: [tech-stacks/web-backend/nodejs-esm-backend.md]
    description: "後端框架"
  storage:
    type: string
    required: false
    referenced_by: [tech-stacks/storage/file-based-storage.md]
    description: "儲存機制"
  testing_framework:
    type: string
    required: false
    referenced_by: [tech-stacks/web-backend/testing-nodejs.md]
    description: "測試框架"
  external_dependency:
    type: list
    required: false
    description: "外部 API / 服務依賴"
  deployment:
    type: string
    required: false
    description: "部署方式"
  last_audit_date:
    type: string
    required: false
    interactive: false
    auto_populate:
      source: system
      value: today
    description: "tech-stack 上次審視日期（YYYY-MM-DD；init 自動填當天；audit 指令執行時更新；依 PROPOSAL_20260424_018 + 019）"
  audit_interval_days:
    type: integer
    required: false
    interactive: false
    auto_populate:
      source: default
      value: 30
    default: 30
    description: "tech-stack audit 間隔天數（@Assistant P-23 巡邏據此判定過期；依 PROPOSAL_20260424_018 + 019）"

# ============================================================
# PATHS — 專案路徑（多 tech-stacks 共用）
# ============================================================
PATHS:
  data_root:
    type: path
    required: true
    referenced_by: [tech-stacks/storage/file-based-storage.md]
    description: "資料儲存根目錄（file-based）"
  project_root:
    type: path
    required: false
    description: "專案原始碼根目錄"
  frontend_root:
    type: path
    required: false
    referenced_by: [tech-stacks/web-frontend/vue3-vite.md]
  docs_root:
    type: path
    required: false
  test_root:
    type: path
    required: false
    referenced_by: [tech-stacks/web-backend/testing-nodejs.md]
  env_example:
    type: path
    required: false
  source_modules:
    storage:
      type: path
      required: false
      referenced_by: [tech-stacks/storage/file-based-storage.md]
    concurrency:
      type: path
      required: false
      referenced_by: [tech-stacks/web-backend/nodejs-esm-backend.md, skills/concurrency-guard-pattern.md]
    archive:
      type: path
      required: false
    middleware:
      type: path
      required: false
      referenced_by: [tech-stacks/messaging/telegram-miniapp-sdk.md, tech-stacks/messaging/telegram-miniapp.md]
    composables:
      type: path
      required: false
      referenced_by: [tech-stacks/web-frontend/vue3-vite.md]
  schedulers:
    type: list
    required: false
    referenced_by: [tech-stacks/web-backend/nodejs-esm-backend.md]
    description: "排程任務清單（crontab / PM2 cron / systemd timer 等）"

# ============================================================
# DEPLOYMENT_CONSTRAINTS — 部署約束（整合 deploy-oracle + infra-constraints Oracle 部分）
# ============================================================
DEPLOYMENT_CONSTRAINTS:
  target:
    type: string
    required: false
    description: "部署目標（例：Oracle VM Free Tier / AWS EC2 / Vercel）"
  cpu:
    type: string
    required: false
  memory:
    type: string
    required: false
    referenced_by: [tech-stacks/storage/file-based-storage.md, skills/infra-constraints.md]
  storage_limit:
    type: string
    required: false
  network_limit:
    type: string
    required: false
    description: "頻寬或流量限制"
  runtime:
    type: string
    required: false
    description: "執行時環境（例：Node.js 20.x / Python 3.11）"
  watchdog:
    type: string
    required: false
    description: "程序監控機制（PM2 / systemd / k8s liveness）"
  process_naming:
    type: string
    required: false
    referenced_by: [skills/infra-constraints.md]
    description: "PM2 / systemd 程序命名規範"
  nginx_config_path:
    type: path
    required: false

# ============================================================
# DEPLOYMENT_SOP — 部署標準作業流程（取代 deploy-oracle.md 內容）
# ============================================================
DEPLOYMENT_SOP:
  deploy_steps:
    type: list
    required: false
    description: "部署步驟依序列表"
  env_sync:
    type: list
    required: false
    description: "環境變數同步方式"
  rollback:
    type: list
    required: false
    description: "回滾 SOP"

# ============================================================
# BUSINESS_DOMAINS — 業務域分類
# ============================================================
BUSINESS_DOMAINS:
  core:
    type: list
    required: false
    description: "核心業務功能清單"
  realtime:
    type: list
    required: false
    description: "即時或排程業務功能清單"

# ============================================================
# 既有欄位（保留 PROPOSAL_002 定義）
# ============================================================
FUNCTIONAL_DOMAINS:
  type: table
  required: false
  description: "功能域分類表（Sprint 規劃用）；包含主要執行 Agent"

CRITICAL_PATHS:
  type: table
  required: false
  description: "關鍵路徑清單 + 每條路徑的驗證條件"

SECURITY_SCOPE_EXTENSIONS:
  type: list
  required: false
  description: "專案特有的安全範疇擴充（對齊 skills/security-audit.md）"

QA_MANDATORY_TESTS:
  type: table
  required: false
  description: "QA 強制測試矩陣（P0 / P1 / P2）"

BUSINESS_RULES:
  type: text
  required: false
  description: "業務規則摘要（自由格式 markdown）；可選擇性包含 license_preference / forbidden_packages 子節（依 PROPOSAL_20260423_002 Prior Art Scan 評估矩陣使用）"

# ============================================================
# EVALUATED_PACKAGES — Prior Art Scan 快取（依 PROPOSAL_20260423_002）
# ============================================================
EVALUATED_PACKAGES:
  type: list
  required: false
  referenced_by: [skills/checklists/prior-art-scan-checklist.md]
  description: "過去 @Architect 執行 Prior Art Scan 的評估結論快取；避免重複評估同一套件；對齐 RULES_DESIGN_GUIDE §十八.F"
  item_schema:
    package_name:
      type: string
      description: "套件名（NPM / PyPI / GitHub 官方名稱）"
    evaluated_date:
      type: date
      description: "評估執行日期（YYYY-MM-DD）"
    feature_context:
      type: string
      description: "當時評估情境（哪個功能 / 問題類型）"
    decision:
      type: enum
      values: [adopted, rejected, pending]
      description: "評估結論"
    reason:
      type: string
      description: "採納或拒絕理由（1-2 句）"
    report_link:
      type: string
      description: "對應 PRIOR_ART_REPORT.md 路徑（docs/plans/prior-art/<name>.md）"
    evaluator:
      type: string
      default: "@Architect"
      description: "執行評估者（預設 @Architect）"

# ============================================================
# RUNTIME_CONTEXT — DEPRECATED (v8.0.9 V90-A-4 / PROPOSAL_502_063)
# ============================================================
# DEPRECATED 原因（user feedback 2026-05-08）：
#   workspace = 專案業務語意；machine-specific 設定（PATH / binary 路徑 / env vars）
#   不該綁專案。同一 workspace 在不同機器路徑不同 → 跨 dev 共享易踩坑。
#
# 新位置：
#   - MCP child process env → .qwen/settings.json mcpServers.<name>.env
#   - Shell command PATH 注入 → 啟動 Qwen Code 前手動跑（qwen.md §1 cmd / PowerShell 範本）
#
# 本 block 保留 schema 以維持兼容；新專案請填 <not_applicable>。
# 既有 workspace 仍可用本 block，但 framework 不再保證 agent 讀取行為（v8.1 可能完全移除）。
RUNTIME_CONTEXT:
  type: block
  required: false
  deprecated: true
  deprecated_since: "v8.0.9"
  deprecated_reason: "machine-specific 不應綁 workspace; 移至 .qwen/settings.json env"
  referenced_by:
    - rules/lead.md
    - tasks/session-start-checklist.md
    - skills/agent-driven-onboarding.md
  description: "workspace 特化的 runtime / shell 環境設定；agent 執行 shell command 前先讀此塊"
  schema:
    platform:
      type: enum
      values: [win32, darwin, linux, wsl]
      required: false
      description: "目標執行平台；agent 可用此判斷使用 powershell vs bash"
    shell:
      type: enum
      values: [powershell, bash, zsh, cmd, sh]
      required: false
      description: "預設 shell；agent 跑 command 時的 wrapper 選擇"
    pre_command_hooks:
      type: list
      required: false
      description: "每次跑 shell command 前須執行的 setup（順序敏感）；如 PATH override / activate venv"
      item_schema:
        description:
          type: string
          description: "本 hook 用途；agent 用於決定何時 invoke"
        command:
          type: string
          description: "完整命令字串（如 '$env:Path = \"D:\\node-v22.12.0-win-x64;\" + $env:Path'；V90-A-7: v22 LTS）"
        shell:
          type: enum
          values: [powershell, bash, zsh, cmd, sh]
          description: "本 hook 用的 shell；可與上層 shell 不同（如 setup script）"
        reason:
          type: string
          required: false
          description: "為何需要此 hook（給 future agent 決策依據）"
    binaries:
      type: map
      required: false
      description: "強制使用的 binary 絕對路徑；overrides $PATH 搜尋；如 {node: 'D:\\node-v22.12.0-win-x64\\node.exe'}"
    env_vars:
      type: map
      required: false
      description: "額外環境變數；session 內必設；如 {NODE_ENV: production, PYTHONPATH: ./src}"

# ============================================================
# GITNEXUS_INTEGRATION — workspace ↔ GitNexus repo 對齊（PROPOSAL_502_038 G-F6）
# ============================================================
GITNEXUS_INTEGRATION:
  type: block
  required: false
  referenced_by:
    - skills/code-graph-exploration.md
    - skills/agent-driven-onboarding.md
  description: "workspace ↔ GitNexus repo 命名 mapping；解決 mempalace wing vs `.gitnexus/` repo 名 mismatch"
  schema:
    gitnexus_repo:
      type: string
      required: false
      interactive: false
      description: "GitNexus repo 名；用於 cross-system query；mempalace wing 與 gitnexus repo 不同名時對齊"
    gitnexus_indexed:
      type: bool
      required: false
      interactive: false
      default: false
      description: "user 是否已對此 workspace 跑 `gitnexus analyze .`（onboarding Step 4.6 寫入）"
    gitnexus_last_index_at:
      type: string
      required: false
      interactive: false
      description: "上次 `gitnexus analyze` 時間戳；ISO8601；>30 天提示重 analyze"
