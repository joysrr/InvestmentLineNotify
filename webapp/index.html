<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>投資助理</title>
    <!-- Telegram WebApp SDK: production loads real SDK, dev uses mock -->
    <!-- TELEGRAM_SDK_PLACEHOLDER -->
    <!-- Debug Tool (dev only) -->

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #222222);
        min-height: 100vh;
      }
      /* Boot loading — 顯示於 SDK 下載期間，Vue mount 或 fallback 渲染後被覆蓋 */

        height: 100vh;
        color: var(--tg-theme-hint-color, #999999);
        font-size: 14px;
      }
    </style>

  <body>

      <div class="boot-loading">載入中…</div>
