name: Documentation Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**/*.md'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**/*.md'

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Validate frontmatter
        run: node scripts/pre-commit-docs-check.mjs
      
      - name: Generate wiki index
        run: node scripts/generate-wiki-index.mjs
      
      - name: Analyze docs health
        run: node scripts/analyze-docs-health.mjs

      - name: Validate docs consistency
        run: node scripts/validate-docs-consistency.mjs
        continue-on-error: true

      - name: Validate docs-code consistency
        run: node scripts/validate-docs-code-consistency.mjs
        continue-on-error: true

      - name: Check health score threshold
        run: |
          SCORE=$(node -e "const report = require('./docs/meta/health-report.json'); console.log(report.summary.average_health)")
          echo "Current health score: $SCORE"
          if (( $(echo "$SCORE < 50" | bc -l) )); then
            echo "❌ Health score below threshold (50)"
            exit 1
          fi
          echo "✅ Health score meets threshold"
      
      - name: Upload health report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-health-report
          path: docs/meta/health-report.json
          retention-days: 30
