name: News Fetch Pipeline

on:
  workflow_dispatch:
    # ℹ️  排程已移至 Oracle VM crontab 執行（2026-04-13）
    # VM 排程時間（台灣時間）：每 4 小時 00:00 / 04:00 / 08:00 / 12:00 / 16:00 / 20:00
    # 此 workflow 保留供 VM 故障時手動應急觸發

permissions:
  contents: none

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run news fetch pipeline
        env:
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: node src/runNewsFetch.mjs
