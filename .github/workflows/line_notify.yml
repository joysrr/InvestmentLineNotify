name: Daily Report & Notify Scheduler

on:
  schedule:
    # ----------------------------------------------------
    # (時間為 UTC)
    # 台灣 07:45 -> UTC 23:45 (開盤前提醒：全開)
    - cron: "45 23 * * *"
    # 台灣 10:00 -> UTC 02:00 (盤中高頻回報)
    - cron: "0 2 * * *"
    # 台灣 12:00 -> UTC 04:00 (午盤高頻回報)
    - cron: "0 4 * * *"
    # 台灣 14:40 -> UTC 06:40 (收盤後大總結：全開)
    - cron: "40 6 * * *"
    # 台灣 21:20 -> UTC 13:20 (夜間國際觀測：美股開盤與籌碼總結)
    - cron: "19 13 * * *"
    # ----------------------------------------------------
  workflow_dispatch: # 允許手動觸發

jobs:
  notify:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 允許寫入內容（如果需要更新檔案或產生新的 commit）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 只抓取最新的 commit，減少不必要的歷史資料

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm" # 啟用 npm 快取，會自動處理 node_modules 的快取

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Check
        env:
          BASE_PRICE_URL: ${{ secrets.BASE_PRICE_URL }}
          STRATEGY_URL: ${{ secrets.STRATEGY_URL }}
          USER_ID: ${{ secrets.USER_ID }}
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          TZ: "Asia/Taipei"
          TELEGRAM_WEBAPP_URL: ${{ secrets.TELEGRAM_WEBAPP_URL }}
          SNAPSHOT_ENCRYPT_KEY: ${{ secrets.SNAPSHOT_ENCRYPT_KEY }}

        run: npm start -- ${{ env.LINE_FLAG }} ${{ env.TG_FLAG }} ${{ env.AI_FLAG }} ${{ env.TRANS_FLAG }}

      - name: Commit and Push Data Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 chore(data): auto-update market cache and ai logs [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Sync data to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            cd ~/investnotify
            git fetch origin main
            git reset --hard origin/main
            echo "[data-sync] $(date) sync 完成 ($(git log --oneline -1))"
        continue-on-error: true
